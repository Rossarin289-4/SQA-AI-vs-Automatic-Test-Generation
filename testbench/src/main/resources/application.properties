server.port=${PORT:8080}
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=24MB
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.endpoint=${OPENROUTER_ENDPOINT:https://openrouter.ai/api/v1/chat/completions}
bench.output-dir=${OUTPUT_DIR:output}
bench.parallelism=${BENCH_PARALLELISM:1}
bench.keep-workspaces=${BENCH_KEEP_WORKSPACES:false}
bench.test-seeding=${BENCH_TEST_SEEDING:false}
bench.prompt-template=${PROMPT_TEMPLATE:prompts/Master_Prompt.md}
bench.junit3-projects=${BENCH_JUNIT3_PROJECTS:Cli}
bench.usd-to-thb=${BENCH_USD_TO_THB:33}
