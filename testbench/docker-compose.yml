services:
  evaluator:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    ports:
      - "${TESTBENCH_BIND_ADDRESS:-127.0.0.1}:${TESTBENCH_PORT:-8081}:8080"
    volumes:
      - .:/workspace
      # Results and the Defects4J working checkouts live here: point TESTBENCH_OUTPUT_DIR at a fast disk (SSD/NVMe) when the
      # project folder itself is on a slow one. Default: ./output inside the project folder.
      - ${TESTBENCH_OUTPUT_DIR:-./output}:/workspace/output
      # Maven Central rate-limits busy addresses (HTTP 429); this routes dependency downloads through Google's mirror.
      - ./maven-settings.xml:/root/.m2/settings.xml:ro
    # Shared server: cap the cores TestBench may use (0 = no cap) and give it a low weight when other containers also want
    # CPU, so they are served first while TestBench still uses idle cores.
    cpus: ${TESTBENCH_CPUS:-0}
    cpu_shares: 512
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      BENCH_PARALLELISM: ${BENCH_PARALLELISM:-1}
      BENCH_KEEP_WORKSPACES: ${BENCH_KEEP_WORKSPACES:-false}
      BENCH_TEST_SEEDING: ${BENCH_TEST_SEEDING:-false}
      BENCH_JUNIT3_PROJECTS: ${BENCH_JUNIT3_PROJECTS:-Cli}
      BENCH_USD_TO_THB: ${BENCH_USD_TO_THB:-33}
      MAVEN_OPTS: -Xmx2g
    init: true
    # The container runs as root; umask 000 keeps files it writes under ./output deletable by the host user.
    command: ["sh", "-c", "umask 000 && exec mvn -B spring-boot:run"]
